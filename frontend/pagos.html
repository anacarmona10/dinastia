<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagar reserva - Dinastía AMV</title>
  <link rel="stylesheet" href="style_pagos.css">
</head>
<body>
  <a href="dashboard.html" class="back-button" aria-label="Volver">←</a>

  <main class="container-pago">
    <section class="card-pago">
      <h1>Completa tu reserva</h1>
      <p>Serás enviado a Stripe para realizar un pago seguro.</p>

      <div class="detalle-articulo">
        <p id="mensajeViaje">Preparando información del viaje…</p>
      </div>

      <form id="formPago">
        <label class="label-pago" for="cantidadPersonas">
          Número de viajeros
        </label>

        <input
          id="cantidadPersonas"
          class="campo-input"
          type="number"
          min="1"
          max="10"
          value="1"
          required
        >

        <div class="separador"></div>

        <button id="botonPagar" type="submit" class="gradient-btn">
          Pagar de forma segura con Stripe
        </button>

        <p id="mensajePago"></p>
      </form>
    </section>
  </main>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const viajeId = Number(parametros.get('viaje_id'));

    const mensajeViaje = document.getElementById('mensajeViaje');
    const mensajePago = document.getElementById('mensajePago');
    const botonPagar = document.getElementById('botonPagar');

    if (!Number.isInteger(viajeId) || viajeId < 1) {
      mensajeViaje.textContent = 'No se recibió un viaje válido.';
      botonPagar.disabled = true;
    } else {
      mensajeViaje.textContent = `Reserva del viaje #${viajeId}`;
    }

    document.getElementById('formPago').addEventListener('submit', async (evento) => {
      evento.preventDefault();

      botonPagar.disabled = true;
      mensajePago.textContent = 'Redirigiendo a Stripe…';

      try {
        const respuesta = await fetch('../backend/api/crear_checkout_stripe.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            viaje_id: viajeId,
            cantidad_personas: Number(document.getElementById('cantidadPersonas').value)
          })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok || !datos.ok) {
          throw new Error(datos.error || 'No fue posible iniciar el pago');
        }

        window.location.assign(datos.url);
      } catch (error) {
        mensajePago.textContent = error.message;
        botonPagar.disabled = false;
      }
    });
  </script>
</body>
</html>
