<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>

    <!-- Font Awesome para el ícono de flecha -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Tu hoja de estilos personalizada -->
    <link rel="stylesheet" href="style_login.css">
</head>
<body>

    <!-- Botón de volver con el mismo estilo que Registro.html -->
    <a href="index.html" class="back-button" aria-label="Volver al inicio">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="login-container">
        <h2>Iniciar Sesión</h2>

        <form id="formLogin" action="../backend/api/login.php" method="post">

            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" name="correo" id="correoLogin" placeholder="Ingresa tu correo">
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" name="contraseña" id="contraseñaLogin" placeholder="Ingresa tu contraseña">
            </div>

            <div id="mensajeLogin"></div>

            <button type="submit">Ingresar</button>

            <!-- ENLACE PARA RECUPERAR CONTRASEÑA -->
            <p class="registro olvido">
                ¿Olvidaste tu contraseña? 
                <a href="olvido_contraseña.html">Ingresa aquí</a>
            </p>

            <p class="registro">
                ¿No tienes cuenta?
                <a href="Registro.html">Regístrate</a>
            </p>

            <p class="registro">
                ¿Eres administrador?
                <a href="login_admin.html">Inicia sesión aquí</a>
            </p>
            
        </form>
    </div>

    <script src="js/validaciones.js"></script>
</body>
</html>
