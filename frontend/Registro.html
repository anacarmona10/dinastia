<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>

    <!-- Anti-FOUC -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Font Awesome (flecha + ojito) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Material Symbols (para el botón de tema) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="style_registro.css">
    <link rel="stylesheet" href="style_dark.css">

    <!-- Script del tema -->
    <script src="js/theme.js"></script>

    <!-- Ajustes específicos modo oscuro -->
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 20px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }

        /* En registro, el fondo oscuro se aplica a la imagen lateral */
        html.dark .image-side::after {
            background: rgba(2, 12, 28, 0.75) !important;
        }

        html.dark .registro-container h2 {
            color: #ffffff !important;
        }

        html.dark .registro {
            color: #cbd5e1 !important;
        }

        html.dark .back-button {
            background: rgba(255, 255, 255, 0.12) !important;
            color: #e2e8f0 !important;
        }

        html.dark .back-button:hover {
            background: rgba(200, 0, 255, 0.28) !important;
            color: #ffffff !important;
        }

        html.dark .campo-password-wrapper .btn-toggle-password,
        html.dark button.btn-toggle-password,
        html.dark .registro-container .btn-toggle-password {
            color: #94a3b8 !important;
        }

        html.dark .campo-password-wrapper .btn-toggle-password:hover,
        html.dark button.btn-toggle-password:hover,
        html.dark .registro-container .btn-toggle-password:hover,
        html.dark .campo-password-wrapper .btn-toggle-password.activo,
        html.dark button.btn-toggle-password.activo,
        html.dark .registro-container .btn-toggle-password.activo {
            color: #c800ff !important;
        }

        /* Evitar que el select tenga fondo blanco en dark */
        html.dark .registro-container select option {
            background: #0d1e38 !important;
            color: #ffffff !important;
        }
    </style>

    <!-- Función del ojito -->
    <script>
        function togglePassword(inputId, boton) {
            var input = document.getElementById(inputId);
            if (!input) return;

            var icono = boton.querySelector('i');

            if (input.type === "password") {
                input.type = "text";
                boton.classList.add("activo");
                if (icono) {
                    icono.classList.remove('fa-eye');
                    icono.classList.add('fa-eye-slash');
                }
            } else {
                input.type = "password";
                boton.classList.remove("activo");
                if (icono) {
                    icono.classList.remove('fa-eye-slash');
                    icono.classList.add('fa-eye');
                }
            }
        }
    </script>
</head>
<body>

    <a href="index.html" class="back-button" aria-label="Volver al inicio">
        <i class="fas fa-arrow-left"></i>
    </a>

    <!-- ✅ Botón modo claro / oscuro -->
    <button
        type="button"
        id="btnToggleTheme"
        class="theme-toggle-auth"
        title="Cambiar modo claro / oscuro"
        aria-label="Cambiar tema"
    >
        <span class="material-symbols-outlined">dark_mode</span>
    </button>

    <div class="main-wrapper">

        <div class="image-side">
            <img src="imagenes/Lago.jpg" alt="Paisaje de lago">
        </div>

        <div class="content-side">
            <div class="registro-container">

                <h2>Registro de Usuarios</h2>

                <form id="formRegistro" method="POST" action="../backend/api/registrar_usuario.php">

                    <input type="text" name="nombreCompleto" id="nombreCompleto" placeholder="Nombre completo">

                    <select name="tipoDocumento" id="tipoDocumento">
                        <option value="">Seleccione un tipo de documento</option>
                        <option value="cc">Cédula de Ciudadanía</option>
                        <option value="ce">Cédula de Extranjería</option>
                        <option value="ppt">Permiso por Protección Temporal</option>
                        <option value="pep">Permiso Especial de Permanencia</option>
                        <option value="passport">Pasaporte</option>
                    </select>

                    <input type="text" name="numeroDocumento" id="numeroDocumento" placeholder="Número de documento">

                    <input type="email" name="correo" id="correo" placeholder="Correo electrónico">

                    <div class="campo-password-wrapper">
                        <input type="password" name="contraseña" id="contraseña" placeholder="Contraseña">
                        <button type="button" class="btn-toggle-password" onclick="togglePassword('contraseña', this)" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="campo-password-wrapper">
                        <input type="password" name="confirmar_contraseña" id="confirm_password" placeholder="Confirmar contraseña">
                        <button type="button" class="btn-toggle-password" onclick="togglePassword('confirm_password', this)" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div id="recaptchaRegistro" aria-label="Verificación anti bots"></div>

                    <button type="submit" class="form-button">Registrar</button>

                    <div id="mensaje"></div>

                    <p class="registro">
                        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                    </p>

                </form>
            </div>
        </div>
    </div>

    <script src="js/validaciones.js"></script>

</body>
</html>
