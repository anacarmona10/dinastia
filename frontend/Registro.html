<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>

    <!-- Font Awesome (flecha + ojito) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="style_registro.css">

    <!-- Función del ojito -->
    <script>
        function togglePassword(inputId, boton) {
            var input = document.getElementById(inputId);
            if (!input) return;

            var icono = boton.querySelector('i');

            if (input.type === "password") {
                input.type = "text";
                boton.classList.add("activo");
                if (icono) {
                    icono.classList.remove('fa-eye');
                    icono.classList.add('fa-eye-slash');
                }
            } else {
                input.type = "password";
                boton.classList.remove("activo");
                if (icono) {
                    icono.classList.remove('fa-eye-slash');
                    icono.classList.add('fa-eye');
                }
            }
        }
    </script>
</head>
<body>

    <a href="index.html" class="back-button" aria-label="Volver al inicio">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="main-wrapper">

        <div class="image-side">
            <img src="imagenes/Lago.jpg" alt="Paisaje de lago">
        </div>

        <div class="content-side">
            <div class="registro-container">

                <h2>Registro de Usuarios</h2>

                <form id="formRegistro" method="POST" action="../backend/api/registrar_usuario.php">

                    <input type="text" name="nombreCompleto" id="nombreCompleto" placeholder="Nombre completo">

                    <select name="tipoDocumento" id="tipoDocumento">
                        <option value="">Seleccione un tipo de documento</option>
                        <option value="cc">Cédula de Ciudadanía</option>
                        <option value="ce">Cédula de Extranjería</option>
                        <option value="ppt">Permiso por Protección Temporal</option>
                        <option value="pep">Permiso Especial de Permanencia</option>
                        <option value="passport">Pasaporte</option>
                    </select>

                    <input type="text" name="numeroDocumento" id="numeroDocumento" placeholder="Número de documento">

                    <input type="email" name="correo" id="correo" placeholder="Correo electrónico">

                    <div class="campo-password-wrapper">
                        <input type="password" name="contraseña" id="contraseña" placeholder="Contraseña">
                        <button type="button" class="btn-toggle-password" onclick="togglePassword('contraseña', this)" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div class="campo-password-wrapper">
                        <input type="password" name="confirmar_contraseña" id="confirm_password" placeholder="Confirmar contraseña">
                        <button type="button" class="btn-toggle-password" onclick="togglePassword('confirm_password', this)" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>

                    <div id="recaptchaRegistro" aria-label="Verificación anti bots"></div>

                    <button type="submit" class="form-button">Registrar</button>

                    <div id="mensaje"></div>

                    <p class="registro">
                        ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                    </p>

                </form>
            </div>
        </div>
    </div>

    <script src="js/validaciones.js"></script>

</body>
</html>
