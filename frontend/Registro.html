<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>

    <!-- Librería de iconos (solo para la flecha y otros) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Hoja de estilos personalizada -->
    <link rel="stylesheet" href="style_registro.css">
</head>
<body>

    <!-- Flecha volver -->
    <a href="index.html" class="back-button" aria-label="Volver al inicio">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="main-wrapper">

        <div class="image-side">
            <img src="imagenes/Lago.jpg" alt="Paisaje de lago">
        </div>

        <div class="content-side">
            <div class="registro-container">

                <h2>Registro de Usuarios</h2>

                <!-- Formulario SIN required -->
                <form id="formRegistro" method="POST" action="../backend/api/registrar_usuario.php">

                    <input type="text" name="nombreCompleto" id="nombreCompleto" placeholder="Nombre completo">

                    <select name="tipoDocumento" id="tipoDocumento">
                        <option value="">Seleccione un tipo de documento</option>
                        <option value="cc">Cédula de Ciudadanía</option>
                        <option value="ce">Cédula de Extranjería</option>
                        <option value="ppt">Permiso por Protección Temporal</option>
                        <option value="pep">Permiso Especial de Permanencia</option>
                        <option value="passport">Pasaporte</option>
                    </select>

                    <input type="text" name="numeroDocumento" id="numeroDocumento" placeholder="Número de documento">

                    <input type="email" name="correo" id="correo" placeholder="Correo electrónico">

                    <input type="password" name="contraseña" id="contraseña" placeholder="Contraseña">

                    <input type="password" name="confirmar_contraseña" id="confirm_password" placeholder="Confirmar contraseña">

                    <button type="submit" class="form-button">Registrar</button>

                    <!-- Aquí se mostrarán mensajes de error o éxito -->
                    <div id="mensaje"></div>

                </form>

                <!-- Sección de inicio con Google (fuera del formulario) -->
                <p class="registro">
                    ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
                </p>

                <div class="separador-o">
                    <span>o continúa con</span>
                </div>

                <!-- ✅ NUEVO: Botón con SVG del logo de Google a color -->
                <a href="../backend/api/auth/google.php" class="btn-google">
                    <svg class="google-logo-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="22" height="22">
                        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
                        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z" />
                        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z" />
                        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z" />
                    </svg>
                    <span>Iniciar sesión con Google</span>
                </a>

            </div>
        </div>
    </div>

    <!-- JavaScript externo (validaciones) -->
    <script src="js/validaciones.js"></script>

</body>
</html>
