<VirtualHost *:80>
    ServerAdmin admin@localhost
    DocumentRoot /var/www/html

    # La interfaz pública se encuentra en /frontend. Mantiene accesibles
    # las rutas /backend/* usadas por la API y Stripe.
    RedirectMatch 302 ^/$ /frontend/index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>