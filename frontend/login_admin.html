        <form id="formLoginAdmin" method="POST" action="../backend/api/login_admin.php">

            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" name="correo" id="correoLoginAdmin" placeholder="Ingresa tu correo" required>

                <a href="login.html">Inicia sesión aquí</a>
            </p>

    <!-- Solo validación simple de campos vacíos (opcional) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('formLoginAdmin');
            form.addEventListener('submit', function(e) {
                const correo = document.getElementById('correoLoginAdmin').value.trim();
                const pass = document.getElementById('contraseñaLoginAdmin').value.trim();
                if (correo === '' || pass === '') {
                    e.preventDefault();
                    alert('Por favor completa todos los campos.');
                }
            });
        });
    </script>

</body>
