<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style_olvido.css">

    <style>
        /* ==========================================================================
           CAMPO DE CONTRASEÑA CON OJITO (Font Awesome)
           ========================================================================== */
        .campo-password-wrapper {
            position: relative;
            width: 100%;
            display: block;
        }

        .campo-password-wrapper input {
            margin-bottom: 0;
            padding-right: 45px !important;
            width: 100%;
        }

        /* Ocultar ojo nativo de navegadores */
        .campo-password-wrapper input[type="password"]::-ms-reveal,
        .campo-password-wrapper input[type="password"]::-ms-clear {
            display: none !important;
            width: 0;
            height: 0;
        }

        .campo-password-wrapper input[type="password"]::-webkit-credentials-auto-fill-button,
        .campo-password-wrapper input[type="password"]::-webkit-textfield-decoration-container {
            display: none !important;
            visibility: hidden;
            pointer-events: none;
            position: absolute;
            right: 0;
        }

        /* ============================================
           BOTÓN DEL OJITO - Centrado y estilizado
           ============================================ */
        .campo-password-wrapper .btn-toggle-password,
        .olvido-container .btn-toggle-password,
        button.btn-toggle-password {
            position: absolute !important;
            top: 50% !important;
            right: 10px !important;
            left: auto !important;
            transform: translateY(-50%) !important;
            background: transparent !important;
            background-color: transparent !important;
            background-image: none !important;
            border: none !important;
            border-radius: 50% !important;
            cursor: pointer !important;
            color: #94a3b8 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 !important;
            margin: 0 !important;
            box-shadow: none !important;
            outline: none !important;
            transition: color 0.2s ease !important;
            z-index: 10 !important;
            width: 36px !important;
            height: 36px !important;
            min-width: 36px !important;
            max-width: 36px !important;
            min-height: 36px !important;
            max-height: 36px !important;
            font-size: 16px !important;
            font-weight: normal !important;
            opacity: 1 !important;
            overflow: visible !important;
            text-align: center !important;
            line-height: 1 !important;
        }

        .campo-password-wrapper .btn-toggle-password:hover,
        .olvido-container .btn-toggle-password:hover,
        button.btn-toggle-password:hover {
            color: #c800ff !important;
            background: transparent !important;
            background-color: transparent !important;
            background-image: none !important;
            transform: translateY(-50%) !important;
            box-shadow: none !important;
        }

        .campo-password-wrapper .btn-toggle-password.activo,
        .olvido-container .btn-toggle-password.activo,
        button.btn-toggle-password.activo {
            color: #c800ff !important;
            background: transparent !important;
            background-color: transparent !important;
        }

        .campo-password-wrapper .btn-toggle-password i,
        .olvido-container .btn-toggle-password i,
        button.btn-toggle-password i {
            font-size: 16px !important;
            color: inherit !important;
            pointer-events: none !important;
            line-height: 1 !important;
            display: inline-block !important;
        }

        .campo-password-wrapper input {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
    </style>

    <script>
        function togglePassword(inputId, boton) {
            var input = document.getElementById(inputId);
            if (!input) return;
            var icono = boton.querySelector('i');

            if (input.type === "password") {
                input.type = "text";
                boton.classList.add("activo");
                if (icono) {
                    icono.classList.remove('fa-eye');
                    icono.classList.add('fa-eye-slash');
                }
            } else {
                input.type = "password";
                boton.classList.remove("activo");
                if (icono) {
                    icono.classList.remove('fa-eye-slash');
                    icono.classList.add('fa-eye');
                }
            }
        }
    </script>
</head>
<body>
    <a href="olvido_contraseña.html" class="back-button" aria-label="Volver a recuperación">
        <i class="fas fa-arrow-left"></i>
    </a>

    <main class="olvido-container">
        <h2>Crea una nueva contraseña</h2>
        <p class="descripcion-recuperacion">Escribe el código que llegó a tu correo y elige una contraseña de al menos 8 caracteres.</p>

        <form id="formRestablecer" novalidate>
            <div class="input-group">
                <label for="codigoRecuperacion">Código de verificación</label>
                <input type="text" id="codigoRecuperacion" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
            </div>

            <div class="input-group">
                <label for="contrasenaNueva">Nueva contraseña</label>
                <div class="campo-password-wrapper">
                    <input type="password" id="contrasenaNueva" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
                    <button type="button" class="btn-toggle-password" onclick="togglePassword('contrasenaNueva', this)" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="confirmacionNueva">Confirmar contraseña</label>
                <div class="campo-password-wrapper">
                    <input type="password" id="confirmacionNueva" autocomplete="new-password" placeholder="Repite tu contraseña" required>
                    <button type="button" class="btn-toggle-password" onclick="togglePassword('confirmacionNueva', this)" aria-label="Mostrar u ocultar contraseña" tabindex="-1">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div id="mensajeRestablecer" role="status" aria-live="polite"></div>
            <button type="submit" id="btnRestablecer">Guardar contraseña</button>

            <p class="registro"><a href="olvido_contraseña.html">Solicitar otro código</a></p>
        </form>
    </main>

    <script>
        const form = document.getElementById('formRestablecer');
        const boton = document.getElementById('btnRestablecer');
        const mensaje = document.getElementById('mensajeRestablecer');

        form.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const codigo = document.getElementById('codigoRecuperacion').value.trim();
            const contrasena = document.getElementById('contrasenaNueva').value;
            const confirmacion = document.getElementById('confirmacionNueva').value;

            boton.disabled = true;
            boton.textContent = 'Guardando…';
            mensaje.textContent = '';

            try {
                const respuesta = await fetch('../backend/api/restablecer_contrasena.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ codigo, contrasena, confirmacion })
                });
                const datos = await respuesta.json();

                if (!respuesta.ok || !datos.ok) {
                    throw new Error(datos.mensaje || 'No fue posible cambiar la contraseña.');
                }

                mensaje.textContent = datos.mensaje;
                mensaje.className = 'mensaje-exito';
                setTimeout(() => window.location.assign('login.html'), 1800);
            } catch (error) {
                mensaje.textContent = error.message || 'No fue posible cambiar la contraseña.';
                mensaje.className = 'mensaje-error';
                boton.disabled = false;
                boton.textContent = 'Guardar contraseña';
            }
        });
    </script>
</body>
</html>
